schema_version: 1

context:
  version: "2.0.0"

package:
  name: freexl
  version: ${{ version }}

source:
  url: http://www.gaia-gis.it/gaia-sins/freexl-${{ version }}.tar.gz
  sha256: 176705f1de58ab7c1eebbf5c6de46ab76fcd8b856508dbd28f5648f7c6e1a7f0
  patches:
    - patches/makefile.vc.patch
    - patches/nmake.opt.patch
    - patches/aarch64.patch

build:
  number: 3

requirements:
  build:
    - if: unix
      then: gnuconfig
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: not win
      then: make
  host:
    - expat
    - libiconv
    - minizip
  run_exports:
    - ${{ pin_subpackage('freexl') }}

tests:
  - script:
      - if: not win
        then: test -f ${PREFIX}/lib/libfreexl.a
      - if: win
        then: if not exist %LIBRARY_BIN%\freexl.dll exit 1
      - if: win
        then: if not exist %LIBRARY_LIB%\freexl_i.lib exit 1

about:
  license: MPL-1.1
  license_file: COPYING
  summary: Extract valid data from within an Excel
  homepage: https://www.gaia-gis.it/fossil/freexl/index

extra:
  recipe-maintainers:
    - akrherz
    - ocefpaf
    - msarahan
